<div class="container">
  <h1 style="font-size: 14px; margin-bottom: 20px; text-align: center; text-transform: uppercase; color: var(--accent-color);">
    TriviAttack!
  </h1>
  <form [formGroup]="form" (ngSubmit)="startQuiz()">
    <div class="form-group">
      <label for="category" style="font-size: 10px; text-transform: uppercase; color: var(--accent-color);">
        Category
      </label>
      <select id="category" formControlName="category">
        <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name.toUpperCase() }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="difficulty" style="font-size: 10px; text-transform: uppercase; color: var(--accent-color);">
        Difficulty
      </label>
      <select id="difficulty" formControlName="difficulty">
        <option *ngFor="let diff of difficulties" [value]="diff">{{ diff.toUpperCase() }}</option>
      </select>
    </div>

    <button type="submit">START QUIZ</button>
  </form>
</div>
